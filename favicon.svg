<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFC700" />
      <stop offset="100%" stop-color="#F5B800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#0A0A0A" stroke="#FFC700" stroke-width="12" stroke-opacity="0.4"/>
  
  <!-- Outer Accent Ring -->
  <rect x="36" y="36" width="440" height="440" rx="76" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
  
  <!-- Code Symbol & MA Monogram -->
  <g transform="translate(0, 10)" filter="url(#glow)">
    <!-- Stylized MA Lettering -->
    <path d="M 120 370 L 175 150 L 225 150 L 256 260 L 287 150 L 337 150 L 392 370 L 337 370 L 312 260 L 275 370 L 237 370 L 200 260 L 175 370 Z" fill="url(#goldGrad)"/>
    <!-- Terminal Accent Bar -->
    <rect x="160" y="390" width="192" height="16" rx="8" fill="#FFC700"/>
  </g>
</svg>
